<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ScrollBeam</title>
<link rel="manifest" href="./manifest.json" />
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  :root {
    --bg: #000000;
    --card: #161618;
    --card-raised: #1f2023;
    --accent: #ff3b30;
    --text: #ffffff;
    --text-dim: #8e8e93;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 20px 18px 40px;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
  }
  .wordmark {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .icon-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--card-raised);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
  }
  .icon-btn svg { width: 18px; height: 18px; }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 18px;
    margin-bottom: 12px;
  }
  .status-card {
    padding: 26px 22px;
    border-radius: 26px;
  }
  .status-card .eyebrow {
    color: var(--text-dim);
    font-size: 13px;
    margin: 0 0 6px;
  }
  .status-card .headline {
    font-size: 19px;
    font-weight: 700;
    line-height: 1.35;
    margin: 0;
  }
  .scan-card { text-align: center; }
  .scan-card p {
    color: var(--text-dim);
    font-size: 13px;
    margin: 10px 0 0;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin: 14px 0 6px;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 14px;
    border: 1px solid #2a2a2d;
    background: #0d0d0e;
    color: var(--text);
    font-size: 14px;
  }
  button {
    border: none;
    border-radius: 16px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    width: 100%;
    padding: 15px;
  }
  button.primary {
    background: var(--accent);
    color: white;
  }
  button.secondary {
    background: var(--card-raised);
    color: var(--text);
    margin-top: 10px;
  }
  video {
    width: 100%;
    border-radius: 18px;
    margin-top: 12px;
    display: none;
  }
  canvas { display: none; }
  .manual-entry summary {
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    padding: 4px 0;
  }
  .pulse {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
    margin-right: 8px;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const CONFIG_KEY = "ytcontinue_config";

const GEAR_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>`;
const CAMERA_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>`;
const SWITCH_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>`;

function getConfig() {
  try { return JSON.parse(localStorage.getItem(CONFIG_KEY) || "null"); }
  catch { return null; }
}
function saveConfig(cfg) {
  localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg));
}

function extractYoutubeWatch(text) {
  const match = text.match(/https?:\/\/(?:www\.)?(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/))[^\s]+/);
  if (!match) return null;
  const url = new URL(match[0]);

  let videoId = null;
  if (url.hostname.includes("youtu.be")) {
    videoId = url.pathname.slice(1).split("/")[0];
  } else if (url.pathname.includes("/shorts/")) {
    videoId = url.pathname.split("/shorts/")[1];
  } else {
    videoId = url.searchParams.get("v");
  }
  if (!videoId) return null;

  const list = url.searchParams.get("list") || null;
  const indexParam = url.searchParams.get("index");
  const index = indexParam ? Math.max(0, parseInt(indexParam, 10) - 1) : null;

  let t = url.searchParams.get("t");
  if (t) t = parseInt(t.replace("s", ""), 10);

  return { platform: "youtube", videoId, list, index, t: t || null };
}

function extractYoutubePlaylist(text) {
  const match = text.match(/https?:\/\/(?:www\.)?youtube\.com\/playlist\?[^\s]+/);
  if (!match) return null;
  const url = new URL(match[0]);
  const list = url.searchParams.get("list");
  if (!list) return null;
  return { platform: "youtube", videoId: null, list, index: null, t: null, playlistOnly: true };
}

function extractInstagramInfo(text) {
  const match = text.match(/https?:\/\/(?:www\.)?instagram\.com\/(?:reel|p|tv)\/[A-Za-z0-9_-]+\/?/);
  if (!match) return null;
  return { platform: "instagram", url: match[0] };
}

function extractTikTokInfo(text) {
  const match = text.match(/https?:\/\/(?:www\.)?tiktok\.com\/@[\w.-]+\/video\/\d+/);
  if (!match) return null;
  return { platform: "tiktok", url: match[0] };
}

function extractTikTokShortLink(text) {
  const match = text.match(/https?:\/\/vt\.tiktok\.com\/[A-Za-z0-9]+\/?/);
  if (!match) return null;
  return { platform: "tiktok", url: match[0] };
}

function extractShareInfo(text) {
  return (
    extractYoutubeWatch(text) ||
    extractYoutubePlaylist(text) ||
    extractInstagramInfo(text) ||
    extractTikTokInfo(text) ||
    extractTikTokShortLink(text) ||
    null
  );
}

async function fetchTitle(videoId) {
  try {
    const res = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`);
    if (!res.ok) throw new Error("no oembed");
    const data = await res.json();
    return data.title || "Shared video";
  } catch {
    return "Shared video";
  }
}

function entryUrl(config) {
  return `${config.databaseURL.replace(/\/+$/, "")}/nowplaying/${config.secret}.json`;
}

function header(showSettings, onSettings) {
  return `
    <div class="header">
      <p class="wordmark">ScrollBeam</p>
      ${showSettings ? `<button class="icon-btn" id="headerSettingsBtn">${GEAR_ICON}</button>` : ""}
    </div>
  `;
}

async function handleShare(config, info) {
  const app = document.getElementById("app");
  app.innerHTML = `
    ${header(false)}
    <div class="card status-card">
      <p class="eyebrow"><span class="pulse"></span>Sending</p>
      <p class="headline">Beaming this over to your desktop...</p>
    </div>
  `;

  let title;
  if (info.platform === "youtube" && info.videoId) {
    title = await fetchTitle(info.videoId);
  } else if (info.platform === "youtube" && info.playlistOnly) {
    title = "Shared playlist";
  } else if (info.platform === "instagram") {
    title = "Shared Instagram post";
  } else if (info.platform === "tiktok") {
    title = "Shared TikTok";
  } else {
    title = "Shared content";
  }

  const entry = { ...info, title, ts: Date.now() };

  try {
    const res = await fetch(entryUrl(config), {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(entry),
    });
    if (!res.ok) throw new Error("write failed");
    app.innerHTML = `
      ${header(false)}
      <div class="card status-card">
        <p class="eyebrow"><span class="pulse"></span>Sent</p>
        <p class="headline">${escapeHtml(title)}</p>
      </div>
    `;
    setTimeout(() => window.close(), 900);
  } catch (e) {
    app.innerHTML = `
      ${header(false)}
      <div class="card status-card">
        <p class="eyebrow">Couldn't send</p>
        <p class="headline">Check your phone has internet and your settings are correct. Try re-scanning the QR code.</p>
      </div>
    `;
  }
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function renderSettings(existing) {
  const app = document.getElementById("app");
  app.innerHTML = `
    ${header(false)}
    <div class="card scan-card">
      <button class="icon-btn" id="scanBtn" style="margin: 0 auto;">${CAMERA_ICON}</button>
      <p>Scan the QR code shown in your desktop extension's settings</p>
      <video id="preview"></video>
      <canvas id="canvas"></canvas>
      <button class="icon-btn" id="switchCamBtn" style="display:none; margin: 10px auto 0;">${SWITCH_ICON}</button>
    </div>
    <div class="card manual-entry">
      <details>
        <summary>Enter details manually instead</summary>
        <label>Firebase Realtime Database URL</label>
        <input id="dbUrl" value="${existing ? existing.databaseURL : ""}" placeholder="https://your-project-default-rtdb.firebaseio.com" />
        <label>Secret room code</label>
        <input id="secret" value="${existing ? existing.secret : ""}" />
        <label>Expiry hours</label>
        <input id="expiryHours" type="number" value="${existing ? existing.expiryHours : 6}" />
        <button class="primary" id="saveBtn" style="margin-top:16px;">Save</button>
      </details>
    </div>
  `;

  document.getElementById("saveBtn").addEventListener("click", () => {
    const cfg = {
      databaseURL: document.getElementById("dbUrl").value.trim(),
      secret: document.getElementById("secret").value.trim(),
      expiryHours: parseFloat(document.getElementById("expiryHours").value) || 6,
    };
    if (!cfg.databaseURL.includes("firebaseio.com")) {
      alert("That doesn't look like a Realtime Database URL. Check it ends in firebaseio.com.");
      return;
    }
    saveConfig(cfg);
    boot();
  });

  document.getElementById("scanBtn").addEventListener("click", startScan);
  document.getElementById("switchCamBtn").addEventListener("click", switchCamera);
}

let allBackCameras = [];
let currentCameraIndex = 0;
let activeStream = null;

async function getBackCameraList() {
  const tempStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment" },
  });
  tempStream.getTracks().forEach((t) => t.stop());

  const devices = await navigator.mediaDevices.enumerateDevices();
  const videoInputs = devices.filter((d) => d.kind === "videoinput");
  return videoInputs.filter((d) => !/front|user/i.test(d.label));
}

async function startScan() {
  const video = document.getElementById("preview");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  video.style.display = "block";

  allBackCameras = await getBackCameraList();

  const savedDeviceId = localStorage.getItem("preferredCameraId");
  currentCameraIndex = allBackCameras.findIndex((d) => d.deviceId === savedDeviceId);
  if (currentCameraIndex === -1) currentCameraIndex = 0;

  document.getElementById("switchCamBtn").style.display =
    allBackCameras.length > 1 ? "flex" : "none";

  await openCamera();

  function tick() {
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height);
      if (code) {
        if (activeStream) activeStream.getTracks().forEach((t) => t.stop());
        try {
          const cfg = JSON.parse(code.data);
          if (cfg.databaseURL && cfg.secret) {
            saveConfig(cfg);
            boot();
            return;
          }
        } catch (e) {
          alert("That QR code didn't contain valid settings.");
        }
        return;
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

async function openCamera() {
  const video = document.getElementById("preview");
  if (activeStream) activeStream.getTracks().forEach((t) => t.stop());

  const camera = allBackCameras[currentCameraIndex];
  const constraints = camera
    ? { video: { deviceId: { exact: camera.deviceId } } }
    : { video: { facingMode: "environment" } };

  try {
    activeStream = await navigator.mediaDevices.getUserMedia(constraints);
  } catch (e) {
    alert("Could not access the camera: " + e.message);
    return;
  }
  video.srcObject = activeStream;
  video.setAttribute("playsinline", true);
  await video.play();

  if (camera) localStorage.setItem("preferredCameraId", camera.deviceId);
}

function switchCamera() {
  if (allBackCameras.length < 2) return;
  currentCameraIndex = (currentCameraIndex + 1) % allBackCameras.length;
  openCamera();
}

function renderHome(config) {
  const app = document.getElementById("app");
  app.innerHTML = `
    ${header(true)}
    <div class="card status-card">
      <p class="eyebrow"><span class="pulse"></span>Ready</p>
      <p class="headline">Share a YouTube, Instagram, or TikTok link here to beam it to your desktop.</p>
    </div>
  `;
  document.getElementById("headerSettingsBtn").addEventListener("click", () => {
    renderSettings(config);
  });
}

function boot() {
  const config = getConfig();
  const params = new URLSearchParams(window.location.search);
  const sharedText = params.get("text") || params.get("url") || params.get("title") || "";

  if (!config || !config.databaseURL || !config.secret) {
    renderSettings(config);
    return;
  }

  if (sharedText) {
    const info = extractShareInfo(sharedText);
    if (info) {
      handleShare(config, info);
    } else {
      document.getElementById("app").innerHTML = `
        ${header(true)}
        <div class="card status-card">
          <p class="eyebrow">Not recognized</p>
          <p class="headline">That didn't look like a YouTube, Instagram, or TikTok link.</p>
        </div>
      `;
      document.getElementById("headerSettingsBtn").addEventListener("click", () => renderSettings(config));
    }
  } else {
    renderHome(config);
  }
}

boot();
</script>
</body>
</html>
